name: tfchain_client
description: A sample command-line application.
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  polkadart: ^0.5.0
  polkadart_keyring: ^0.5.0
  substrate_bip39: ^0.5.0
  polkadart_cli: ^0.5.0
  hex: ^0.2.0
  bip39: ^1.0.6
  moment_dart: ^3.2.1
  signer: 
    git:
      url: https://github.com/threefoldtech/tfgrid-sdk-dart.git
      ref: development
      path: packages/signer
  hashlib: ^1.21.1
  substrate_metadata: ^1.3.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.14
  coverage: ^1.11.1

polkadart:
  output_dir: lib/generated
  chains:
    dev: wss://tfchain.dev.grid.tf/ws
    # qa: wss://tfchain.qa.grid.tf/ws
    # test: wss://tfchain.test.grid.tf/ws
    # main: wss://tfchain.grid.tf/ws

scripts:
  test: --coverage=coverage
